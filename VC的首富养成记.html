<style>
:root{
  --bg:#F5FBF8; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F0F9F4;
  --green:#45B37E; --green-deep:#2E9463; --green-light:#B9EBCD;
  --income:#3AA876; --expense:#E2726B;
  --text:#22332A; --text2:rgba(34,51,42,.58); --text3:rgba(34,51,42,.38);
  --divider:rgba(34,51,42,.09);
  --on-accent:#FFFFFF;
  --card-shadow:0 2px 14px rgba(34,74,52,.07);
  --radius:20px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overscroll-behavior-y:none;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center;
}
.num{font-family:"Manrope",-apple-system,sans-serif;}
#app{
  width:100%; max-width:520px; min-height:100vh;
  display:flex; flex-direction:column; position:relative;
  background:var(--bg);
}
#view{flex:1; padding:calc(var(--safe-top) + 14px) 16px 100px; overflow-y:auto;}
.hidden{display:none !important;}

/* ---------- 卡片通用 ---------- */
.card{background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:var(--card-shadow); border:1px solid rgba(34,51,42,.04);}
.hero-card{
  background:linear-gradient(135deg,#EAF8EF,#CDEFDA);
  color:var(--text); border-radius:var(--radius); padding:18px; margin-bottom:14px;
  border:1px solid rgba(69,179,126,.16);
}
.section-title{font-size:14px; font-weight:700; margin:0 0 12px; color:var(--text);}
.muted{color:var(--text2); font-size:12px;}

/* ---------- 顶部 header ---------- */
.header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.header h1{font-size:19px; font-weight:800; margin:0;}
.header p{margin:2px 0 0; font-size:11.5px; color:var(--text2);}
.crown{font-size:22px;}

/* ---------- 财富进度卡 ---------- */
.wealth-top{display:flex; justify-content:space-between; align-items:flex-start;}
.wealth-title{font-size:11px; opacity:.6; margin-bottom:4px;}
.wealth-name{font-size:21px; font-weight:800; display:flex; align-items:center; gap:6px;}
.wealth-net{font-size:17px; font-weight:800; text-align:right;}
.bar-track{background:rgba(34,51,42,.12); border-radius:6px; height:10px; margin-top:14px; overflow:hidden;}
.bar-fill{background:var(--green-deep); height:100%; border-radius:6px; transition:width .4s;}
.wealth-hint{font-size:11px; opacity:.65; margin-top:7px;}

/* ---------- 月度总览 ---------- */
.month-switch{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.month-switch button{background:none; border:none; color:var(--text2); font-size:18px; padding:6px 10px;}
.month-switch .m-title{font-size:15px; font-weight:700;}
.summary-row{display:flex;}
.summary-col{flex:1; text-align:center; padding:0 4px;}
.summary-col + .summary-col{border-left:1px solid var(--divider);}
.summary-label{font-size:11.5px; color:var(--text2); margin-bottom:6px;}
.summary-value{font-size:15px; font-weight:800;}

/* ---------- 分类条形图 ---------- */
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.bar-row .name{width:64px; font-size:12px; color:var(--text2); flex-shrink:0;}
.bar-row .track{flex:1; height:10px; background:rgba(34,51,42,.07); border-radius:5px; overflow:hidden;}
.bar-row .fill{height:100%; border-radius:5px;}
.bar-row .amt{width:64px; text-align:right; font-size:12px; font-weight:700; flex-shrink:0;}

/* ---------- 流水行 ---------- */
.tx-row{display:flex; align-items:center; gap:12px; padding:9px 0;}
.tx-row + .tx-row{border-top:1px solid var(--divider);}
.tx-icon{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
.tx-mid{flex:1; min-width:0;}
.tx-name{font-size:13.5px; font-weight:600;}
.tx-note{font-size:11.5px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tx-amt{font-size:14.5px; font-weight:800; flex-shrink:0;}
.empty-tip{text-align:center; color:var(--text2); font-size:13px; padding:34px 0;}

/* ---------- Tab Bar ---------- */
.tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:520px;
  background:var(--bg2); border-top-left-radius:26px; border-top-right-radius:26px;
  display:flex; align-items:flex-end; padding:10px 6px calc(14px + var(--safe-bottom));
  box-shadow:0 -2px 16px rgba(34,74,52,.08);
}
.tab-btn{flex:1; background:none; border:none; color:var(--text3); display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; font-size:10.5px;}
.tab-btn.active{color:var(--green-deep);}
.tab-btn .ic{font-size:19px;}
.tab-add{flex:1; display:flex; justify-content:center;}
.tab-add button{
  width:54px; height:54px; border-radius:50%; border:none;
  background:linear-gradient(135deg,var(--green),var(--green-deep));
  color:var(--on-accent); font-size:26px; font-weight:800; margin-top:-20px;
  box-shadow:0 8px 18px rgba(69,179,126,.35);
}

/* ---------- Modal / Sheet ---------- */
.sheet-mask{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40; display:flex; align-items:flex-end; justify-content:center;}
.sheet{
  width:100%; max-width:520px; max-height:92vh; overflow-y:auto;
  background:var(--bg); border-top-left-radius:24px; border-top-right-radius:24px;
  padding:14px 18px calc(24px + var(--safe-bottom));
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
.sheet-head{display:flex; align-items:center; justify-content:space-between; padding:6px 0 14px;}
.sheet-head .title{font-size:15.5px; font-weight:800;}
.sheet-head button{background:none; border:none; color:var(--text2); font-size:14px; padding:6px;}
.sheet-head button.primary{color:var(--green-deep); font-weight:800;}

/* ---------- 记账弹窗 ---------- */
.type-switch{display:flex; gap:8px; margin-bottom:14px;}
.type-switch button{flex:1; padding:9px; border-radius:11px; border:1px solid var(--divider); font-size:13.5px; font-weight:700; background:var(--card); color:var(--text2);}
.type-switch button.active.expense{background:var(--expense); color:#fff;}
.type-switch button.active.income{background:var(--income); color:var(--on-accent);}
.amount-input{display:flex; align-items:center; gap:8px; padding:6px 0 16px;}
.amount-input span{font-size:26px; font-weight:700; color:var(--text2);}
.amount-input input{flex:1; border:none; background:none; color:var(--text); font-size:34px; font-weight:800; font-family:"Manrope",sans-serif; outline:none;}
.cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px 8px; margin-top:6px;}
.cat-cell{display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:none;}
.cat-circle{width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:21px;}
.cat-cell.small .cat-circle{width:42px; height:42px; font-size:18px;}
.cat-cell span{font-size:11px; color:var(--text2); max-width:60px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cat-cell.selected span{color:var(--text); font-weight:700;}
.note-input{width:100%; margin-top:14px; padding:12px; border-radius:12px; border:1px solid var(--divider); background:var(--card); color:var(--text); font-size:13.5px; outline:none;}
.note-input::placeholder{color:var(--text3);}
.save-btn{width:100%; margin-top:18px; padding:14px; border:1px solid var(--divider); border-radius:14px; font-size:15px; font-weight:800; background:var(--card); color:var(--text3);}
.save-btn.ready{background:linear-gradient(135deg,var(--green),var(--green-deep)); color:var(--on-accent); border:none;}

/* ---------- 表单通用 ---------- */
.form-item{margin-bottom:16px;}
.form-item label{display:block; font-size:12px; color:var(--text2); margin-bottom:7px;}
.form-item input, .form-item textarea{
  width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--divider); background:var(--card);
  color:var(--text); font-size:14px; outline:none;
}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{padding:6px 12px; border-radius:20px; background:var(--card); color:var(--text2); font-size:12px; border:1px solid var(--divider);}
.chip.active{background:var(--green); color:var(--on-accent); font-weight:700; border-color:var(--green);}
.swatch{width:30px; height:30px; border-radius:50%; border:2px solid transparent;}
.swatch.active{border-color:var(--text);}
.icon-opt{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--card); border:1px solid var(--divider);}
.icon-opt.active{background:var(--green-light); border-color:var(--green);}

/* ---------- 账单页 ---------- */
.filter-scroll{display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:2px;}
.filter-scroll::-webkit-scrollbar{display:none;}
.day-group{margin-bottom:6px;}
.day-head{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text2); padding:10px 2px 4px;}
.day-head .in{color:var(--income); margin-right:8px;}
.day-head .out{color:var(--expense);}

/* ---------- 分类管理 ---------- */
.cat-manage-group{margin-bottom:16px;}
.cat-manage-title{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; margin-bottom:10px;}
.cat-manage-subs{display:flex; flex-wrap:wrap; gap:8px;}
.sub-chip{display:flex; align-items:center; gap:6px; background:var(--card); padding:7px 10px 7px 8px; border-radius:20px; font-size:12.5px; border:1px solid var(--divider);}
.sub-chip button{background:none; border:none; color:var(--text3); font-size:13px; padding:0 0 0 4px;}
.add-sub-chip{background:none; border:1.5px dashed var(--divider); color:var(--text2);}

/* ---------- 存款 ---------- */
.account-row{display:flex; align-items:center; gap:12px; background:var(--card); border-radius:16px; padding:13px; margin-bottom:10px; box-shadow:var(--card-shadow); border:1px solid rgba(34,51,42,.04);}
.account-icon{width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;}
.account-mid{flex:1; min-width:0;}
.account-name{font-size:13.5px; font-weight:700; margin-bottom:5px;}
.mini-progress{height:5px; width:110px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden;}
.mini-progress .fill{height:100%; border-radius:3px;}
.account-balance{font-size:14.5px; font-weight:800;}

/* ---------- 养成/我的 ---------- */
.level-header{text-align:center; padding:26px 0;}
.level-header .ic{font-size:38px;}
.level-header .name{font-size:21px; font-weight:800; margin:8px 0 4px;}
.badge-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.badge{display:flex; flex-direction:column; align-items:center; gap:6px;}
.badge-circle{width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; background:var(--card2); color:var(--text3); border:1px solid var(--divider);}
.badge-circle.unlocked{background:linear-gradient(135deg,var(--green),var(--green-deep)); color:var(--on-accent); border:none;}
.badge span{font-size:10.5px; color:var(--text2); text-align:center;}
.badge.unlocked span{color:var(--text); font-weight:600;}
.settings-row{display:flex; align-items:center; gap:12px; padding:14px 2px; font-size:13.5px;}
.settings-row + .settings-row{border-top:1px solid var(--divider);}
.settings-row .arrow{margin-left:auto; color:var(--text3);}

/* ---------- 引导页 ---------- */
.guide-step{display:flex; gap:12px; background:var(--card); border-radius:14px; padding:13px; margin-bottom:12px; border:1px solid var(--divider);}
.guide-num{width:24px; height:24px; border-radius:50%; background:var(--green); color:var(--on-accent); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.guide-step b{font-size:13.5px; display:block; margin-bottom:3px;}
.guide-step p{margin:0; font-size:12px; color:var(--text2); line-height:1.5;}

::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>

  <nav class="tabbar">
    <button class="tab-btn" data-tab="dashboard"><span class="ic">🏠</span>首页</button>
    <button class="tab-btn" data-tab="bills"><span class="ic">📒</span>账单</button>
    <div class="tab-add"><button id="fabAdd">＋</button></div>
    <button class="tab-btn" data-tab="savings"><span class="ic">💰</span>存款</button>
    <button class="tab-btn" data-tab="profile"><span class="ic">👑</span>养成</button>
  </nav>
</div>

<script>
/* =========================================================
   VC的首富养成记 —— 单文件 PWA
   数据全部存储在浏览器 localStorage 中（仅本机可见，未接入云同步）
   ========================================================= */

const STORE_KEYS = {
  categories:'vc_categories', transactions:'vc_transactions',
  savingsAccounts:'vc_savings_accounts', savingsRecords:'vc_savings_records',
  progress:'vc_progress'
};

function load(key, fallback){ try{ const v = localStorage.getItem(key); return v? JSON.parse(v): fallback; }catch(e){ return fallback; } }
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------------- 默认分类 ---------------- */
function buildDefaultCategories(){
  const mk = (name, icon, color, type, subs=[]) => {
    const id = uid();
    const parent = { id, name, icon, color, type, isCustom:false, hidden:false, parentId:null };
    const children = subs.map(s => ({ id:uid(), name:s[0], icon:s[1], color, type, isCustom:false, hidden:false, parentId:id }));
    return [parent, ...children];
  };
  return [
    ...mk('餐饮','🍜','#FF8A5B','expense',[['早餐','☕'],['正餐','🍽️'],['外卖','🛵'],['奶茶咖啡','🧋'],['聚餐','👨‍👩‍👧']]),
    ...mk('交通','🚗','#4E9DE0','expense',[['公交地铁','🚇'],['打车','🚕'],['加油','⛽'],['停车','🅿️'],['火车飞机','✈️']]),
    ...mk('购物','🛍️','#B168E0','expense',[['服饰鞋包','👗'],['日用百货','🧴'],['数码电器','📱'],['美妆护肤','💄']]),
    ...mk('娱乐','🎮','#E05C8A','expense',[['电影演出','🎬'],['游戏充值','🕹️'],['旅行','🧳'],['运动健身','🏃']]),
    ...mk('居住','🏠','#6C7BE0','expense',[['房租房贷','🏘️'],['水电燃气','💡'],['物业','🏢'],['家居家装','🛋️']]),
    ...mk('医疗','🏥','#3FC1C9','expense',[['看病买药','💊'],['体检','🩺'],['保险','🛡️']]),
    ...mk('教育','📚','#5CB85C','expense',[['课程培训','🎓'],['书籍资料','📖']]),
    ...mk('人情往来','🧧','#E0A83C','expense',[['红包礼金','🧧'],['请客送礼','🎁']]),
    ...mk('其他支出','⚪️','#9AA0A6','expense',[]),
    ...mk('工资','💼','#2FB380','income',[['基本工资','💼'],['奖金','🌟'],['提成','📈']]),
    ...mk('副业兼职','💻','#2FA6B3','income',[]),
    ...mk('投资理财','📊','#C79A2E','income',[['股票基金','📈'],['利息分红','💹']]),
    ...mk('红包礼金','🧧','#D9534F','income',[]),
    ...mk('其他收入','⚪️','#9AA0A6','income',[]),
  ];
}

/* ---------------- 财富等级 & 成就 ---------------- */
const WEALTH_LEVELS = [
  {id:1,title:'月光族',icon:'🌙',th:0},
  {id:2,title:'省钱新手',icon:'🙂',th:1000},
  {id:3,title:'小有积蓄',icon:'👛',th:5000},
  {id:4,title:'储蓄达人',icon:'💵',th:20000},
  {id:5,title:'小富之家',icon:'🏠',th:50000},
  {id:6,title:'投资新贵',icon:'📈',th:100000},
  {id:7,title:'财务自由',icon:'🍃',th:300000},
  {id:8,title:'商界精英',icon:'🏢',th:800000},
  {id:9,title:'企业家',icon:'👑',th:2000000},
  {id:10,title:'地区首富',icon:'👑',th:5000000},
  {id:11,title:'VC的首富',icon:'✨',th:10000000},
];
function levelInfo(netWorth){
  let cur = WEALTH_LEVELS[0];
  for(const l of WEALTH_LEVELS){ if(netWorth >= l.th) cur = l; }
  const idx = WEALTH_LEVELS.findIndex(l=>l.id===cur.id);
  const next = WEALTH_LEVELS[idx+1] || null;
  let ratio = 1;
  if(next){
    const span = next.th - cur.th;
    ratio = span>0 ? Math.min(Math.max((netWorth-cur.th)/span,0),1) : 0;
  }
  return {cur, next, ratio};
}
const ACHIEVEMENTS = [
  {id:'first_record', title:'初来乍到', icon:'🚩'},
  {id:'streak_7', title:'自律一周', icon:'🔥'},
  {id:'streak_30', title:'习惯养成', icon:'🔥'},
  {id:'first_savings', title:'开源节流', icon:'💵'},
  {id:'savings_10k', title:'小金库', icon:'🏦'},
  {id:'positive_month', title:'月月有余', icon:'📈'},
  {id:'level_5', title:'小富之家', icon:'🏠'},
  {id:'level_9', title:'企业家精神', icon:'👑'},
  {id:'ten_records', title:'记账新星', icon:'⭐'},
];

/* ---------------- 状态 ---------------- */
let categories = load(STORE_KEYS.categories, null);
if(!categories){ categories = buildDefaultCategories(); save(STORE_KEYS.categories, categories); }
let transactions = load(STORE_KEYS.transactions, []);
let savingsAccounts = load(STORE_KEYS.savingsAccounts, []);
let savingsRecords = load(STORE_KEYS.savingsRecords, []);
let progress = load(STORE_KEYS.progress, {unlocked:[], lastRecordDate:null, currentStreak:0, longestStreak:0});

let currentTab = 'dashboard';
let dashMonth = new Date();
let billsMonth = new Date();
let billsFilter = null;

function persistAll(){
  save(STORE_KEYS.categories, categories);
  save(STORE_KEYS.transactions, transactions);
  save(STORE_KEYS.savingsAccounts, savingsAccounts);
  save(STORE_KEYS.savingsRecords, savingsRecords);
  save(STORE_KEYS.progress, progress);
}

/* ---------------- 工具函数 ---------------- */
function fmtMoney(v, showSign=false){
  const n = Number(v)||0;
  const sign = (showSign && n>0) ? '+' : (n<0? '-':'');
  const abs = Math.abs(n).toLocaleString('zh-CN',{minimumFractionDigits:2, maximumFractionDigits:2});
  return `¥${sign}${abs}`;
}
function sameMonth(dateStr, ref){
  const d = new Date(dateStr);
  return d.getFullYear()===ref.getFullYear() && d.getMonth()===ref.getMonth();
}
function monthTitle(d){ return `${d.getFullYear()}年${d.getMonth()+1}月`; }
function dayTitle(d){
  const wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日 ${wk}`;
}
function topCategories(type){ return categories.filter(c=>!c.parentId && c.type===type && !c.hidden).sort((a,b)=>0); }
function subCategories(parentId){ return categories.filter(c=>c.parentId===parentId); }

function netWorth(){
  const flow = transactions.reduce((s,t)=> s + (t.type==='income'? t.amount : -t.amount), 0);
  const sv = savingsAccounts.reduce((s,a)=> s + accountBalance(a.id), 0);
  return flow + sv;
}
function accountBalance(accId){
  return savingsRecords.filter(r=>r.accountId===accId).reduce((s,r)=>s+r.amount,0);
}
function totalSavings(){ return savingsAccounts.reduce((s,a)=>s+accountBalance(a.id),0); }

function registerStreak(){
  const today = new Date(); today.setHours(0,0,0,0);
  const last = progress.lastRecordDate ? new Date(progress.lastRecordDate) : null;
  if(last){ last.setHours(0,0,0,0); }
  if(last && last.getTime()===today.getTime()){ /* 今天已记过 */ }
  else if(last && (today.getTime()-last.getTime())===86400000){ progress.currentStreak++; }
  else { progress.currentStreak = 1; }
  progress.longestStreak = Math.max(progress.longestStreak, progress.currentStreak);
  progress.lastRecordDate = today.toISOString();
}
function evaluateAchievements(){
  const set = new Set(progress.unlocked||[]);
  if(transactions.length>0) set.add('first_record');
  if(transactions.length>=10) set.add('ten_records');
  if(progress.currentStreak>=7) set.add('streak_7');
  if(progress.currentStreak>=30) set.add('streak_30');
  if(savingsRecords.length>0) set.add('first_savings');
  if(totalSavings()>=10000) set.add('savings_10k');
  const now = new Date();
  const mIncome = transactions.filter(t=>t.type==='income' && sameMonth(t.date, now)).reduce((s,t)=>s+t.amount,0);
  const mExpense = transactions.filter(t=>t.type==='expense' && sameMonth(t.date, now)).reduce((s,t)=>s+t.amount,0);
  if(mIncome>mExpense && mIncome>0) set.add('positive_month');
  const nw = netWorth();
  if(nw>=50000) set.add('level_5');
  if(nw>=2000000) set.add('level_9');
  progress.unlocked = Array.from(set);
  return set;
}

/* ---------------- 渲染路由 ---------------- */
function render(){
  const view = document.getElementById('view');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===currentTab));
  if(currentTab==='dashboard') view.innerHTML = renderDashboard();
  if(currentTab==='bills') view.innerHTML = renderBills();
  if(currentTab==='savings') view.innerHTML = renderSavings();
  if(currentTab==='profile') view.innerHTML = renderProfile();
  bindViewEvents();
}

/* ---------- 首页 ---------- */
function renderDashboard(){
  const monthTx = transactions.filter(t=>sameMonth(t.date, dashMonth));
  const income = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const balance = income-expense;
  const info = levelInfo(netWorth());
  const isCurrentMonth = sameMonth(new Date().toISOString(), dashMonth);

  const byCat = {};
  monthTx.filter(t=>t.type==='expense').forEach(t=>{
    byCat[t.categoryName] = byCat[t.categoryName] || {amount:0, color:t.color};
    byCat[t.categoryName].amount += t.amount;
  });
  const catList = Object.entries(byCat).sort((a,b)=>b[1].amount-a[1].amount).slice(0,6);
  const maxCat = catList.length? catList[0][1].amount : 1;

  const recent = monthTx.slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,6);

  return `
  <div class="header">
    <div><h1>VC的首富养成记</h1><p>每一笔记账，都是通往首富的一步</p></div>
  </div>

  <div class="hero-card">
    <div class="wealth-top">
      <div><div class="wealth-title">当前称号</div><div class="wealth-name">${info.cur.icon} ${info.cur.title}</div></div>
      <div><div class="wealth-title" style="text-align:right">净资产</div><div class="wealth-net num">${fmtMoney(netWorth())}</div></div>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${info.ratio*100}%"></div></div>
    <div class="wealth-hint">${info.next ? `距离「${info.next.title}」还差 ${fmtMoney(Math.max(info.next.th-netWorth(),0))}` : '恭喜，你已经是「VC的首富」！'}</div>
  </div>

  <div class="card">
    <div class="month-switch">
      <button data-act="dash-prev">‹</button>
      <div class="m-title">${monthTitle(dashMonth)}</div>
      <button data-act="dash-next" ${isCurrentMonth?'style="opacity:.25" disabled':''}>›</button>
    </div>
    <div class="summary-row">
      <div class="summary-col"><div class="summary-label">收入</div><div class="summary-value num" style="color:var(--income)">${fmtMoney(income)}</div></div>
      <div class="summary-col"><div class="summary-label">支出</div><div class="summary-value num" style="color:var(--expense)">${fmtMoney(expense)}</div></div>
      <div class="summary-col"><div class="summary-label">结余</div><div class="summary-value num" style="color:${balance>=0?'var(--green-deep)':'var(--expense)'}">${fmtMoney(balance)}</div></div>
    </div>
  </div>

  ${catList.length? `
  <div class="card">
    <div class="section-title">本月支出分类</div>
    ${catList.map(([name,d])=>`
      <div class="bar-row">
        <div class="name">${name}</div>
        <div class="track"><div class="fill" style="width:${(d.amount/maxCat*100)}%;background:${d.color}"></div></div>
        <div class="amt num">${fmtMoney(d.amount)}</div>
      </div>`).join('')}
  </div>` : ''}

  <div class="card">
    <div class="section-title">最近记账</div>
    ${recent.length? recent.map(txRowHtml).join('') : `<div class="empty-tip">本月还没有记账，点下方 ＋ 开始吧</div>`}
  </div>
  `;
}

function txRowHtml(t){
  return `<div class="tx-row" data-tx="${t.id}">
    <div class="tx-icon" style="background:${t.color}2e">${t.icon}</div>
    <div class="tx-mid">
      <div class="tx-name">${t.subName || t.categoryName}</div>
      <div class="tx-note">${t.note || new Date(t.date).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>
    <div class="tx-amt num" style="color:${t.type==='income'?'var(--income)':'var(--text)'}">${t.type==='income'?'+':'-'}${Math.abs(t.amount).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
  </div>`;
}

/* ---------- 账单页 ---------- */
function renderBills(){
  let list = transactions.filter(t=>sameMonth(t.date, billsMonth));
  if(billsFilter) list = list.filter(t=>t.categoryName===billsFilter);
  list.sort((a,b)=> new Date(b.date)-new Date(a.date));

  const groups = {};
  list.forEach(t=>{
    const key = new Date(t.date).toDateString();
    groups[key] = groups[key] || [];
    groups[key].push(t);
  });
  const allCatNames = Array.from(new Set(transactions.map(t=>t.categoryName)));

  return `
  <div class="header"><h1>账单</h1></div>
  <div class="month-switch">
    <button data-act="bills-prev">‹</button>
    <div class="m-title">${monthTitle(billsMonth)}</div>
    <button data-act="bills-next">›</button>
  </div>
  ${allCatNames.length? `
  <div class="filter-scroll">

function saveTransaction(){

  const top = categories.find(c=>c.id===recordState.topId);

    subName: sub? sub.name: null, icon: sub? sub.icon: top.icon, color: top.color,
    date:new Date().toISOString(), note:recordState.note||'', createdAt:new Date().toISOString()
  };
  transactions.push(tx);
  registerStreak();
  persistAll();
  closeSheet();
  render();
}

/* =========================================================
   通用 Sheet 控制
   ========================================================= */
let sheetStack = [];
function openSheet(html, isCategoryManageContext){
  const mask = document.createElement('div');
  mask.className = 'sheet-mask';
  mask.innerHTML = `<div class="sheet">${html}</div>`;
  mask.addEventListener('click', (e)=>{ if(e.target===mask) closeSheet(); });
  document.body.appendChild(mask);
  sheetStack.push(mask);
  bindSheetEvents(mask);
}
function closeSheet(){
  const mask = sheetStack.pop();
  if(mask) mask.remove();
}
function refreshTopSheet(html){
  if(sheetStack.length===0) return;
  const mask = sheetStack[sheetStack.length-1];
  mask.querySelector('.sheet').innerHTML = html;
  bindSheetEvents(mask);
}

function bindSheetEvents(mask){
  mask.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click', onSheetAction);
  });
  const amountField = mask.querySelector('#amountField');
  if(amountField) amountField.addEventListener('input', e=>{ recordState.amount = e.target.value; syncSaveBtn(); });
  const noteField = mask.querySelector('#noteField');
  if(noteField) noteField.addEventListener('input', e=>{ recordState.note = e.target.value; });
  const saveTxBtn = mask.querySelector('#saveTxBtn');
  if(saveTxBtn) saveTxBtn.addEventListener('click', saveTransaction);
  const saveCatBtn = mask.querySelector('#saveCatBtn');
  if(saveCatBtn) saveCatBtn.addEventListener('click', saveNewCategory);
  const saveAccountBtn = mask.querySelector('#saveAccountBtn');
  if(saveAccountBtn) saveAccountBtn.addEventListener('click', saveNewAccount);
  const saveRecordBtn = mask.querySelector('#saveRecordBtn');
  if(saveRecordBtn) saveRecordBtn.addEventListener('click', saveSavingsRecord);
}
function syncSaveBtn(){
  const btn = document.querySelector('#saveTxBtn');
  if(!btn) return;
  const ok = parseFloat(recordState.amount)>0 && recordState.topId;
  btn.classList.toggle('ready', !!ok);
  btn.disabled = !ok;
}

function onSheetAction(e){
  const el = e.currentTarget;
  const act = el.dataset.act;
  if(act==='close-sheet') return closeSheet();
  if(act==='rec-type'){ recordState.type = el.dataset.v; recordState.topId=null; recordState.subId=null; refreshTopSheet(renderRecordSheet()); }
  if(act==='pick-top'){ recordState.topId = el.dataset.id; recordState.subId=null; refreshTopSheet(renderRecordSheet()); }
  if(act==='pick-sub'){ recordState.subId = (recordState.subId===el.dataset.id)? null : el.dataset.id; refreshTopSheet(renderRecordSheet()); }
  if(act==='manage-type'){ refreshTopSheet(renderCategoryManageSheet(el.dataset.v)); }
  if(act==='add-top-category'){ openAddCategory(el.dataset.type, null); }
  if(act==='add-sub-category'){ openAddCategory(el.dataset.type, el.dataset.parent); }
  if(act==='pick-icon'){ newCatState.icon = el.dataset.v; refreshTopSheet(renderAddCategorySheet()); }
  if(act==='pick-color'){ newCatState.color = el.dataset.v; refreshTopSheet(renderAddCategorySheet()); }
  if(act==='hide-cat'){ const c=categories.find(x=>x.id===el.dataset.id); c.hidden=!c.hidden; persistAll(); refreshTopSheet(renderCategoryManageSheet(c.type)); }
  if(act==='del-cat'){ const c=categories.find(x=>x.id===el.dataset.id); categories=categories.filter(x=>x.id!==el.dataset.id && x.parentId!==el.dataset.id); persistAll(); refreshTopSheet(renderCategoryManageSheet(c.type)); }
  if(act==='open-savings-record'){ openSavingsRecord(el.dataset.acc, el.dataset.deposit==='1'); }
  if(act==='back-to-account'){ openAccountDetail(recordAccState.accId); }
}

  if(aboutBtn) aboutBtn.onclick = openAbout;
}

/* ---------------- Tab / FAB ---------------- */
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click', ()=>{ currentTab = b.dataset.tab; render(); });
});
document.getElementById('fabAdd').addEventListener('click', ()=> openRecordModal());

render();
</script>
